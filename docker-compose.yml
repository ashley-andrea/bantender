# Production-like stack for our server. Same service split as the Azure target:
#   caddy → Azure Front Door, api → Container Apps, volumes → Blob / PostgreSQL (added in the next layer).
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      REFERENCE_DIR: /reference/v1
    volumes:
      - app_data:/data
      - ./data/reference/v1:/reference/v1:ro   # company reference data, mounted read-only
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 30s
      timeout: 5s

volumes:
  app_data:
  caddy_data:
