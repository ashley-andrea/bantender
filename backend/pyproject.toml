[project]
name = "tender-pricing"
version = "0.1.0"
description = "Tender pricing assistant: tender PDF to traceable first price"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
