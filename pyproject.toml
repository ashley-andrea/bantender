[project]
name = "tender-pricing"
version = "0.1.0"
description = "Tender pricing assistant: tender PDF to traceable first price"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "openai>=2",
    "openpyxl>=3.1.5",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Win-probability model (backend/app/winprob). Installed in the API image; without it the API runs on the placeholder.
winprob = [
    "numpy>=2",
    "pandas>=2",
    "scikit-learn>=1.5",
]

[dependency-groups]
# Default for `uv sync`; the API image uses --no-dev to stay small.
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "numpy>=2",
    "pandas>=2",
    "scikit-learn>=1.5",
]

[tool.uv]
# OneDrive rejects hardlinks into the uv cache (os error 396).
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
