services:
  web:
    build: ./frontend
    container_name: bantender-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      # LAN
      caddy_0: bantender.home.arpa
      caddy_0.tls: internal
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      # Public
      caddy_1: bantender.duckdns.org
      caddy_1.reverse_proxy: "{{upstreams 80}}"
    networks:
      - homeserver

  api:
    build: { context: ., dockerfile: backend/Dockerfile, target: api }
    container_name: bantender-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DATA_DIR: /data
      REFERENCE_DIR: /reference/v2
      WIN_CONTEXT_PATH: /context/tender_context.json
    volumes:
      - app_data:/data
      - ./data/reference/v2:/reference/v2:ro
      - ./data/samples/oberglatt/tender_context.json:/context/tender_context.json:ro
    labels:
      # Same sites as web; Caddy matches /api/* before web's catch-all
      caddy_0: bantender.home.arpa
      caddy_0.reverse_proxy: "/api/* {{upstreams 8000}}"
      caddy_1: bantender.duckdns.org
      caddy_1.reverse_proxy: "/api/* {{upstreams 8000}}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 30s
      timeout: 5s
    networks:
      - homeserver

volumes:
  app_data:

networks:
  homeserver:
    external: true
